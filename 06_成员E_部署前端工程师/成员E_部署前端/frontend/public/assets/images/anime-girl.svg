<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 640" width="480" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE4EF"/>
      <stop offset="1" stop-color="#FFF5F9"/>
    </linearGradient>
    <linearGradient id="dress" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9DC4"/>
      <stop offset="1" stop-color="#F45B9A"/>
    </linearGradient>
  </defs>

  <!-- 背景圆 -->
  <circle cx="240" cy="300" r="240" fill="url(#bg)"/>
  <circle cx="240" cy="300" r="205" fill="#FFFFFF" opacity="0.55"/>

  <!-- 樱花树枝 -->
  <g stroke="#D98BA8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M70 560 Q150 430 190 320"/>
    <path d="M150 470 Q190 430 240 410"/>
    <path d="M60 500 Q110 470 150 470"/>
  </g>

  <!-- 头发(粉棕) -->
  <path d="M160 250 Q150 190 190 160 Q240 130 300 170 Q335 195 325 250
           L320 330 Q280 360 250 345 L240 360 L210 345 Q175 330 160 250 Z"
        fill="#D9A08C"/>

  <!-- 刘海 -->
  <path d="M175 220 Q185 175 225 165 L240 200 Q220 200 210 225 Z" fill="#E8B49C"/>
  <path d="M235 165 Q280 160 300 185 L280 220 Q260 195 235 200 Z" fill="#E8B49C"/>

  <!-- 脸 -->
  <ellipse cx="240" cy="252" rx="72" ry="82" fill="#FFE8EF"/>

  <!-- 眼睛(日系) -->
  <ellipse cx="212" cy="252" rx="15" ry="17" fill="#4A3B5C"/>
  <ellipse cx="268" cy="252" rx="15" ry="17" fill="#4A3B5C"/>
  <ellipse cx="216" cy="248" rx="6" ry="7" fill="#FFFFFF"/>
  <ellipse cx="272" cy="248" rx="6" ry="7" fill="#FFFFFF"/>
  <ellipse cx="207" cy="257" rx="4" ry="4" fill="#8B7CF6" opacity="0.7"/>

  <!-- 腮红 -->
  <ellipse cx="196" cy="272" rx="12" ry="7" fill="#FF9DC4" opacity="0.5"/>
  <ellipse cx="284" cy="272" rx="12" ry="7" fill="#FF9DC4" opacity="0.5"/>

  <!-- 嘴 -->
  <path d="M230 282 Q240 290 250 282" stroke="#E88AA8" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- 脖子与身体(和服) -->
  <rect x="228" y="322" width="24" height="28" rx="8" fill="#FFE8EF"/>
  <path d="M160 350 Q160 560 185 580 L295 580 Q320 560 320 350
           Q260 385 240 385 Q200 385 160 350 Z" fill="url(#dress)"/>
  <path d="M220 385 L240 470 L260 385" stroke="#FFFFFF" stroke-width="6" fill="none" opacity="0.8"/>
  <path d="M185 430 L295 430" stroke="#FFE4EF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  <path d="M178 500 L302 500" stroke="#FFE4EF" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- 袖子 -->
  <path d="M160 350 Q120 400 130 460 Q150 470 170 430 Q175 400 185 380 Z" fill="#FF8FBE" opacity="0.9"/>
  <path d="M320 350 Q360 400 350 460 Q330 470 310 430 Q305 400 295 380 Z" fill="#FF8FBE" opacity="0.9"/>

  <!-- 手 -->
  <circle cx="150" cy="470" r="12" fill="#FFE8EF"/>
  <circle cx="330" cy="470" r="12" fill="#FFE8EF"/>

  <!-- 樱花点缀 -->
  <g fill="#F45B9A">
    <circle cx="120" cy="200" r="9" opacity="0.85"/>
    <circle cx="120" cy="200" r="9" opacity="0"/>
    <path d="M120 191c-5-3-10-1-10 3 0 5 6 7 10 5 4 2 10 0 10-5 0-4-5-6-10-3z" fill="#F45B9A"/>
    <circle cx="140" cy="168" r="7" fill="#FF9DC4"/>
    <circle cx="368" cy="180" r="8" fill="#FFB7D5"/>
    <circle cx="350" cy="150" r="6" fill="#F45B9A" opacity="0.8"/>
    <circle cx="385" cy="230" r="7" fill="#FF9DC4"/>
    <circle cx="95"  cy="280" r="6" fill="#FFB7D5"/>
    <circle cx="150" cy="120" r="6" fill="#FF9DC4" opacity="0.7"/>
    <circle cx="330" cy="115" r="7" fill="#FFB7D5" opacity="0.8"/>
  </g>
  <text x="240" y="618" text-anchor="middle" font-size="17" fill="#F45B9A" opacity="0.75" font-family="sans-serif">🌸 樱花少女 · 占位图</text>
  <text x="240" y="634" text-anchor="middle" font-size="11" fill="#B07A93" opacity="0.6" font-family="sans-serif">替换为 /assets/images/anime-girl.png 即可</text>
</svg>
